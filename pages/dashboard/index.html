<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如我所书 · 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0e17;--card:#1a1932;--border:#2d2b55;--text:#e0def4;--dim:#908caa;--accent:#c4a7e7;--accent2:#9ccfd8;--danger:#eb6f92;--good:#3e8fb0;--r:12px;--input:rgba(15,14,23,0.6);--warn:#f6c177}
html[data-theme="light"]{--bg:#f2f0f8;--card:#ffffff;--border:#dcd7ef;--text:#2b2840;--dim:#6f6b90;--accent:#6d4fa8;--accent2:#20768a;--danger:#c73f63;--good:#20768a;--input:#ffffff;--warn:#a3690e}
.ico{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:rgba(196,167,231,0.12);color:var(--accent);font-size:12px;font-weight:700;margin-right:2px}
.ico-lg{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:rgba(196,167,231,0.12);color:var(--accent);font-size:14px;font-weight:700;margin-right:6px;vertical-align:middle}
.st{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(144,140,170,0.08);font-size:11px}

body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sb{width:210px;min-height:100vh;background:var(--card);border-right:1px solid var(--border);padding:20px 0 14px;flex-shrink:0;display:flex;flex-direction:column}
.sb h1{font-size:17px;padding:0 18px 16px;border-bottom:1px solid var(--border);margin-bottom:10px;color:var(--accent)}
.sb .tab{display:flex;align-items:center;gap:8px;padding:11px 18px;cursor:pointer;color:var(--dim);transition:.2s;border-left:3px solid transparent;font-size:14px}
.sb .tab:hover{color:var(--text);background:rgba(196,167,231,0.06)}
.sb .tab.act{color:var(--accent);border-left-color:var(--accent);background:rgba(196,167,231,0.1)}
.sb .spacer{flex:1}
.sync{display:flex;align-items:center;gap:7px;padding:10px 18px 0;font-size:11px;color:var(--dim)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0;transition:.3s}
.sync .dot.ok{background:var(--good);box-shadow:0 0 6px rgba(62,143,176,0.7)}
.sync .dot.bad{background:var(--danger)}
.main{flex:1;padding:28px;overflow-y:auto;max-height:100vh}
.page{display:none}.page.act{display:block}
h2{font-size:20px;margin-bottom:18px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:.2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h3{font-size:15px;margin-bottom:6px}
.card p{font-size:13px;color:var(--dim);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;margin:5px 3px 0 0;background:rgba(196,167,231,0.13);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:.2s}
.btn:hover{border-color:var(--accent)}
.btn-p{background:var(--accent);color:#0f0e17;border-color:var(--accent)}
.btn-p:hover{opacity:.85}
.btn-ai{border-color:rgba(156,207,216,0.5);color:var(--accent2)}
.btn-ai:hover{background:rgba(156,207,216,0.12);border-color:var(--accent2)}
.btn-d{border-color:var(--danger);color:var(--danger)}
.btn-d:hover{background:rgba(235,111,146,0.1)}
.btn-sm{padding:4px 10px;font-size:12px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.fg input,.fg textarea,.fg select{width:100%;padding:9px 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;transition:.2s}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--accent)}
.fg textarea{min-height:70px;resize:vertical;font-family:inherit}
.fr{display:flex;gap:10px}.fr .fg{flex:1}
.hintline{font-size:12px;color:var(--dim);margin:0 0 14px;line-height:1.6}
.banner{display:none;background:rgba(235,111,146,0.14);border-bottom:1px solid var(--danger);color:var(--text);padding:12px 20px;font-size:13px;line-height:1.6;position:fixed;top:0;left:0;right:0;z-index:3000}
.banner.show{display:block}
.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center}
.modalbg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:90%;max-width:680px;max-height:84vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:14px}
.ma{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13px;transform:translateY(100px);opacity:0;transition:.3s;z-index:2000;max-width:70vw}
.toast.show{transform:translateY(0);opacity:1}
.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--danger)}
.loading{text-align:center;padding:36px;color:var(--dim);font-size:14px}
.cs{margin-bottom:24px}.cs h3{font-size:14px;color:var(--accent2);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.sb2{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px}
.sb2.go{background:rgba(62,143,176,0.2);color:var(--good)}
.sb2.pa{background:rgba(196,167,231,0.13);color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.search input{flex:0 1 320px;padding:8px 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px}
.search input:focus{outline:none;border-color:var(--accent)}

.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0;flex-wrap:wrap}
.tabs button{padding:7px 14px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:transparent;color:var(--dim);cursor:pointer;font-size:12px;transition:.2s}
.tabs button:hover{color:var(--text)}
.tabs button.act{background:var(--card);border-color:var(--border);color:var(--accent);margin-bottom:-1px}
.tc{display:none}.tc.act{display:block}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.item .kv{flex:1;font-size:12px;min-width:0}
.item .kv strong{font-size:13px}
.item .acts{display:flex;gap:4px;flex-shrink:0}
.script-regex{display:inline-block;font-family:Consolas,Menlo,monospace;font-size:11px;background:var(--input);border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent2)}
.script-repl{font-family:Consolas,Menlo,monospace;font-size:11px;color:var(--dim)}
.test-out{margin-top:10px;padding:12px;background:var(--input);border:1px solid var(--border);border-radius:8px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto;font-family:Consolas,Menlo,monospace}
.ckline{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-bottom:14px}
.ckline input{width:auto}
.rowitem{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.rowitem input{padding:7px 10px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
.rowitem .rn{flex:0 0 130px}
.rowitem .rd{flex:1}
.rowitem button{padding:4px 9px;font-size:12px}
.stages{border:1px dashed var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.previewbox{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.7;color:var(--dim);margin-bottom:12px;white-space:pre-wrap}
.previewbox b{color:var(--text)}
.rchart{display:flex;justify-content:center;margin:10px 0}
.rchart canvas{width:200px;height:200px;filter:drop-shadow(0 0 8px rgba(196,167,231,0.3))}

</style>
</head>
<body>

<div class="banner" id="banner"></div>

<div class="sb">
  <h1>如我所书</h1>
  <div class="tab act" data-t="worlds"><span class="ico">W</span> 世界与图鉴</div>
  <div class="tab" data-t="characters"><span class="ico">C</span> 角色卡库</div>
  <div class="tab" data-t="saves"><span class="ico">S</span> 存档馆</div>
  <div class="tab" data-t="config"><span class="ico">P</span> 配置</div>
  <div class="tab" data-t="scripts"><span class="ico">R</span> 渲染脚本</div>
  <div class="spacer"></div>
  <div class="sync"><span class="dot" id="sync-dot"></span><span id="sync-txt">实时同步未连接</span></div>
</div>

<div class="main">
  <div class="page act" id="p-worlds">
    <h2 style="margin-bottom:12px"><span class="ico-lg">W</span> 世界与图鉴</h2>
    <div class="tabs" id="aw-tabs">
      <button class="act" data-t="world" onclick="aswitch('world')">世界观</button>
      <button data-t="race" onclick="aswitch('race')">种族库</button>
      <button data-t="job" onclick="aswitch('job')">职业库</button>
    </div>
    <div class="tc act" id="awc-world">
      <div class="search"><input id="world-search" placeholder="🔍 搜索世界观（名称 / 描述 / 标签）" oninput="lw()"></div>
      <div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap">
        <div><input id="world-import" type="file" accept="application/json" hidden onchange="importWorldFile(this)"><button class="btn" onclick="document.getElementById('world-import').click()">导入 V3</button> <button class="btn btn-p" onclick="we()">+ 新建</button></div>
      </div>
      <div class="grid" id="wl"></div>
    </div>
    <div class="tc" id="awc-race">
      <div class="hintline">种族决定角色创建时的三维补正与天赋被动/负面；带「内置」徽章的条目由插件预置，可直接修改（修改后不会被版本升级覆盖）。AI 可一键生成新种族。</div>
      <div class="search"><input id="race-search" placeholder="🔍 搜索种族（名称 / 描述 / 天赋）" oninput="la('race')"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap">
        <span style="font-size:13px;color:var(--dim)" id="ac-race"></span>
        <button class="btn btn-ai" onclick="archAI('race')">🤖 AI 生成种族</button>
        <button class="btn btn-p" onclick="ae()">+ 新建种族</button>
      </div>
      <div class="grid" id="al-race"></div>
    </div>
    <div class="tc" id="awc-job">
      <div class="hintline">职业决定角色创建时的三维补正与专属技能；带「内置」徽章的条目由插件预置，可直接修改。AI 可一键生成新职业。</div>
      <div class="search"><input id="job-search" placeholder="🔍 搜索职业（名称 / 描述 / 技能）" oninput="la('job')"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap">
        <span style="font-size:13px;color:var(--dim)" id="ac-job"></span>
        <button class="btn btn-ai" onclick="archAI('job')">🤖 AI 生成职业</button>
        <button class="btn btn-p" onclick="ae()">+ 新建职业</button>
      </div>
      <div class="grid" id="al-job"></div>
    </div>
  </div>
  <div class="page" id="p-characters">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0"><span class="ico-lg">C</span> 角色卡库</h2>
      <div><span style="font-size:13px;color:var(--dim)" id="cc"></span>
        <button class="btn btn-ai" onclick="charAI()">🤖 AI 生成角色</button>
        <input id="char-import" type="file" accept="application/json,image/png" hidden onchange="importCharacterFile(this)"><button class="btn" onclick="document.getElementById('char-import').click()">导入 JSON/PNG</button>
        <button class="btn btn-p" onclick="ce('')">+ 新建角色</button></div>
    </div>
    <div class="search"><input id="char-search" placeholder="🔍 搜索角色（UID / 名字 / 描述 / 种族 / 职业）" oninput="lc()"></div>
    <div class="grid" id="cl"></div>
  </div>
  <div class="page" id="p-saves">
    <h2><span class="ico-lg">S</span> 存档馆</h2>
    <div class="grid" id="sl"></div>
  </div>
  <div class="page" id="p-config">
    <h2><span class="ico-lg">P</span> 配置</h2>
    <div id="cf"></div>
  </div>
  <div class="page" id="p-scripts">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0"><span class="ico-lg">R</span> 渲染脚本</h2>
      <div><span style="font-size:13px;color:var(--dim)" id="sc-count"></span> <button class="btn btn-p" onclick="scriptNew()">+ 新增脚本</button></div>
    </div>
    <div class="hintline">渲染脚本按顺序作用于发送给用户的显示文本副本（不影响内部状态与存档），最多 50 条；仅启用中的脚本生效，正则使用 Python re 语法。</div>
    <div id="script-editor" style="display:none;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:18px">
      <h3 style="font-size:14px;color:var(--accent);margin-bottom:12px" id="se-title">新增脚本</h3>
      <div class="fr">
        <div class="fg"><label>脚本名称</label><input id="se-name" placeholder="例如：消除思考残留"></div>
        <div class="fg" style="flex:0.4;display:flex;align-items:flex-end;padding-bottom:14px"><label class="ckline" style="margin:0"><input type="checkbox" id="se-enabled" checked> 启用</label></div>
      </div>
      <div class="fg"><label>查找正则（find_regex，Python re 语法）</label><textarea id="se-regex" rows="2" placeholder="例如：&lt;think&gt;[\s\S]*?&lt;/think&gt;"></textarea></div>
      <div class="fg"><label>替换文本（replace_string，支持 $1 等分组引用）</label><textarea id="se-repl" rows="2" placeholder="留空表示删除匹配内容"></textarea></div>
      <div class="ma" style="margin-top:6px"><button class="btn" onclick="scriptEditorCancel()">取消</button><button class="btn btn-p" onclick="scriptEditorSave()">保存脚本</button></div>
    </div>
    <div id="scl"></div>
    <div class="cs" style="margin-top:22px">
      <h3>测试预览</h3>
      <div class="fg"><label>示例文本</label><textarea id="ts-sample" rows="3" placeholder="粘贴一段冒险输出文本用于测试"></textarea></div>
      <div class="fr">
        <div class="fg"><label>查找正则</label><input id="ts-regex" placeholder="&lt;think&gt;[\s\S]*?&lt;/think&gt;"></div>
        <div class="fg"><label>替换文本</label><input id="ts-repl" placeholder="留空表示删除"></div>
      </div>
      <button class="btn" onclick="runScriptTest()">▶ 测试</button>
      <pre class="test-out" id="ts-out" hidden></pre>
    </div>
  </div>
</div>

<div class="modalbg" id="mbg"><div class="modal" id="mct"></div></div>
<div class="toast" id="t"></div>

<script>
"use strict";
/* ================= 基础工具 ================= */
function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function jsq(s){return String(s===undefined||s===null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\r/g,'').replace(/\n/g,'\\n')}
function uid(){try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID().replace(/-/g,'')}catch(e){}return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
function gv(id){const el=document.getElementById(id);return el?el.value:''}
function clampText(s,n){s=String(s===undefined||s===null?'':s);return s.length>n?s.slice(0,n)+'…':s}
const tt=(m,t='good')=>{const e=document.getElementById('t');e.textContent=m;e.className='toast '+t;setTimeout(()=>e.classList.add('show'),10);setTimeout(()=>e.classList.remove('show'),2500)};
function showBanner(msg){const b=document.getElementById('banner');b.textContent=msg;b.classList.add('show')}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('初始化超时')),ms))])}
function csv(v){return String(v===undefined||v===null?'':v).split(/[\n,，、]+/).map(s=>s.trim()).filter(Boolean)}
function structTraits(list){return (Array.isArray(list)?list:[]).map(t=>typeof t==='string'?{name:t,desc:''}:{name:String(t&&t.name||'').trim(),desc:String(t&&t.desc||'').trim()}).filter(t=>t.name)}

/* ================= 桥接层 ================= */
let P=null;               // window.AstrBotPluginPage
let _ctx=null;            // 桥上下文（isDark/locale 等）
const ag=(endpoint,params)=>P.apiGet(endpoint,params||{});
const ap=(endpoint,body)=>P.apiPost(endpoint,body||{});

/* 模态框：扩展为可携带“取消回调”，供 promise 化的 confirm/prompt 使用 */
let _modalCancel=null;
const mo=(html,onCancel)=>{document.getElementById('mct').innerHTML=html;document.getElementById('mbg').classList.add('show');_modalCancel=onCancel||null;document.getElementById('mct').parentElement.scrollTop=0};
const mc=()=>{document.getElementById('mbg').classList.remove('show');const cb=_modalCancel;_modalCancel=null;if(cb)cb()};
document.getElementById('mbg').onclick=e=>{if(e.target===e.currentTarget)mc()};

/* sandbox 无 allow-modals：confirm/prompt 不可用，用模态框 promise 替代 */
function uiConfirm(msg,title){return new Promise(res=>{
  mo('<h3>'+esc(title||'确认操作')+'</h3><div style="font-size:13px;line-height:1.7;color:var(--text)">'+esc(msg)+'</div>'+
     '<div class="ma"><button class="btn" id="ui-c">取消</button><button class="btn btn-d" id="ui-ok">确认</button></div>',
     ()=>res(false));
  document.getElementById('ui-ok').onclick=()=>{_modalCancel=null;mc();res(true)};
  document.getElementById('ui-c').onclick=()=>{_modalCancel=null;mc();res(false)};
})}
function uiPrompt(title,label,val){return new Promise(res=>{
  mo('<h3>'+esc(title)+'</h3><div class="fg"><label>'+esc(label||'')+'</label><input id="ui-p" value="'+esc(val===undefined||val===null?'':val)+'"></div>'+
     '<div class="ma"><button class="btn" id="ui-c">取消</button><button class="btn btn-p" id="ui-ok">确定</button></div>',
     ()=>res(null));
  const inp=document.getElementById('ui-p');
  const ok=()=>{const v=inp.value;_modalCancel=null;mc();res(v)};
  document.getElementById('ui-ok').onclick=ok;
  document.getElementById('ui-c').onclick=()=>{_modalCancel=null;mc();res(null)};
  inp.focus();inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')ok()});
})}

/* ================= 全局状态 ================= */
var _activeTab='worlds';
let _wtemp=null,_wsource='';                 // 世界观编辑暂存
let _ctemp=null,_cuid='',_cIsNew=false;      // 角色编辑暂存
let _savesData={};                           // 存档列表缓存（供“查看”使用）
let _charsData={};                           // 角色列表缓存
let _scriptsData=[];                         // 渲染脚本缓存
let _editScriptId=null;                      // 当前编辑的脚本 id（null=新增）
let _cfgTypes={};                            // 配置键 → 控件类型
let _cfgWorlds=[];                           // 世界观名列表
var _suppress={};                            // 本地变更抑制窗口（防 SSE 重复刷新）
function markLocal(type){_suppress[type]=Date.now()}
function suppressed(type){return _suppress[type]&&Date.now()-_suppress[type]<5000}

/* 兼容 dict / array 两种列表返回形态 */
function entriesOf(d){if(Array.isArray(d))return d.map(x=>[x&&(x.id||x.uid||x.name||''),x]);if(d&&typeof d==='object')return Object.entries(d);return []}
/* 兼容 {preview:{...}} 与直接返回卡对象两种形态 */
function pickPreview(resp){if(!resp||typeof resp!=='object')return {};if(resp.preview&&typeof resp.preview==='object')return resp.preview;return resp}

/* ================= 实时同步（SSE） ================= */
let _sseId=null,_sseUp=false,_sseTimer=null,_sseFails=0;
function setSync(ok,txt){const d=document.getElementById('sync-dot');d.className='dot '+(ok?'ok':(ok===false?'bad':''));document.getElementById('sync-txt').textContent=txt||(ok?'实时同步已连接':'实时同步未连接')}
async function sseConnect(){
  try{
    _sseId=await P.subscribeSSE('events',{
      onOpen(){_sseUp=true;_sseFails=0;setSync(true)},
      onError(){_sseUp=false;setSync(false);scheduleSseReconnect()},
      onMessage(m){handleEvent(m&&m.parsed)}
    });
  }catch(e){_sseFails++;if(_sseFails>=5){setSync(false,'实时同步不可用');return}scheduleSseReconnect()}
}
function scheduleSseReconnect(){
  if(_sseTimer)return;
  _sseTimer=setTimeout(async()=>{
    _sseTimer=null;
    if(_sseUp)return; // EventSource 已自动恢复
    try{if(_sseId)await P.unsubscribeSSE(_sseId)}catch(e){}
    _sseId=null;sseConnect();
  },8000);
}
const EVENT_LABEL={worlds_changed:'世界观库已同步',characters_changed:'角色卡库已同步',saves_changed:'存档馆已同步',config_changed:'配置已同步',render_scripts_changed:'渲染脚本已同步',archetypes_changed:'图鉴已同步'};
function handleEvent(msg){
  if(!msg||typeof msg!=='object'||!msg.type)return;
  const type=String(msg.type);
  if(!EVENT_LABEL.hasOwnProperty(type))return;
  if(suppressed(type))return; // 自己刚改过，SSE 事件为回声
  if(type==='worlds_changed'){
    if(_activeTab==='worlds'&&_subTab==='world')lw();
    refreshConfigWorldOptions();
  }else if(type==='characters_changed'){
    if(_activeTab==='characters')lc();
  }else if(type==='saves_changed'){
    if(_activeTab==='saves')ls();
  }else if(type==='config_changed'){
    if(_activeTab==='config')updateConfigRuntime();else refreshConfigWorldOptions();
  }else if(type==='render_scripts_changed'){
    if(_activeTab==='scripts')lscripts();
  }else if(type==='archetypes_changed'){
    if(_activeTab==='worlds'&&_subTab!=='world')la();
  }
  tt(EVENT_LABEL[type]);
}

function _matchSearch(hay,needle){if(!needle)return true;return String(hay||'').toLowerCase().indexOf(needle)>=0}
async function lw(){const el=document.getElementById('wl');el.innerHTML='<div class="loading">加载中...</div>';
  try{const d=await ag('worlds');
    const e=entriesOf(d);_cfgWorlds=e.map(([k])=>k);
    const kw=(gv('world-search')||'').trim().toLowerCase();
    const filtered=e.filter(([n,w])=>!kw||_matchSearch(n,kw)||_matchSearch(w&&w.overview&&w.overview.description||w&&w.content,kw)||_matchSearch(w&&w.overview&&w.overview.tags&&w.overview.tags.join(','),kw));
    if(!e.length){el.innerHTML='<div class="loading">暂无世界观，点击右上角「+ 新建」或直接在聊天里投稿</div>';return}
    if(!filtered.length){el.innerHTML='<div class="loading">没有匹配「'+esc(kw)+'」的世界观</div>';return}
    el.innerHTML=filtered.map(([n,w])=>{
      const ov=w&&w.overview||{};
      const title=ov.title||w.title||n;
      const desc=(ov.description||w.description||w.content||'');
      const npcCount=(w.npc||[]).length;
      const plotCount=(w.plotlines||w.plot_nodes||[]).length;
      const clueCount=(w.clues||[]).length;
      const eggCount=(w.eggs||w.easter_eggs||[]).length;
      const entryCount=(w.entries||[]).length;
      const tier=ov.power_tier?' <span class="badge" style="background:rgba(246,193,119,0.14);color:var(--warn)">⚖️'+esc(ov.power_tier)+'</span>':'';
      return `<div class="card" onclick="we('${jsq(n)}')"><h3>${esc(title)}</h3>
      ${desc?`<p>${esc(clampText(desc,90))}</p>`:'<p style="color:var(--dim)">暂无描述</p>'}
      <div><span class="badge">${npcCount} 人物</span><span class="badge">${plotCount} 剧情</span><span class="badge">${clueCount} 伏笔</span><span class="badge">${eggCount} 彩蛋</span><span class="badge">${entryCount} 条目</span>${tier}</div>
      <div style="margin-top:8px"><button class="btn btn-sm" onclick="event.stopPropagation();exportWorld('${jsq(n)}')">导出 V3</button> <button class="btn btn-sm btn-d" onclick="event.stopPropagation();dw('${jsq(n)}')">删除</button></div></div>`;
    }).join('')}
  catch(e){el.innerHTML='<div class="loading" style="color:var(--danger)">'+esc(e.message)+'</div>'}}

function wtab(act){
  document.querySelectorAll('#mct .tabs button').forEach(e=>e.classList.remove('act'));
  document.querySelectorAll('#mct .tc').forEach(e=>e.classList.remove('act'));
  const bt=document.querySelector('#mct .tabs button[data-t="'+act+'"]');if(bt)bt.classList.add('act');
  const el=document.getElementById('wtc-'+act);if(el)el.classList.add('act');
}

const GRADES=['F','E','D','C','B','A','A+','S'];
function bandName(p){if(p>=9999)return '神明级';if(p>=1000)return '神话级';if(p>=501)return '灾厄级';if(p>=151)return '超凡';if(p>=51)return '精英';if(p>=21)return '训练者';return '普通人'}

function buildRaceField(name){const hit=name?_archHit('race',name):null;
  if(hit&&hit[1]){const a=hit[1];const ab=a.attr_bonus||{};
    return {name:a.name,description:a.description||'',race_lore:a.race_lore||'',
      innate_passives:structTraits(a.innate_passives),innate_negatives:structTraits(a.innate_negatives),
      attr_bonus:{str:+ab.str||0,agi:+ab.agi||0,spr:+ab.spr||0}}}
  return {name:name||'',description:'',race_lore:'',innate_passives:[],innate_negatives:[],attr_bonus:{str:0,agi:0,spr:0}}}
function buildJobField(name){const hit=name?_archHit('job',name):null;
  if(hit&&hit[1]){const a=hit[1];const ab=a.attr_bonus||{};
    const skills=(a.job_skills||[]).map(s=>({name:(s&&s.name)||'',desc:(s&&s.desc)||''})).filter(s=>s.name);
    return {name:a.name,description:a.description||'',play_style:a.play_style||'',job_skills:skills,
      job_skill:skills[0]?{name:skills[0].name,desc:skills[0].desc}:null,
      attr_bonus:{str:+ab.str||0,agi:+ab.agi||0,spr:+ab.spr||0}}}
  return {name:name||'',description:'',play_style:'',job_skills:[],job_skill:null,attr_bonus:{str:0,agi:0,spr:0}}}
function previewRPG(){
  if(!_ctemp)return null;
  const base=_ctemp.attr||{};
  const rb=(_ctemp.race&&_ctemp.race.attr_bonus)||{},jb=(_ctemp.job&&_ctemp.job.attr_bonus)||{};
  const s=Math.max(1,(+base.str||5)+(+rb.str||0)+(+jb.str||0));
  const a2=Math.max(1,(+base.agi||5)+(+rb.agi||0)+(+jb.agi||0));
  const p=Math.max(1,(+base.spr||5)+(+rb.spr||0)+(+jb.spr||0));
  const ch=_ctemp.charm||'C',lu=_ctemp.luck||'C';
  let power=Math.round((s*0.4+a2*0.3+p*0.3)*((GRADE_COEFF[ch]||1)+(GRADE_COEFF[lu]||1))/2);
  const ovEl=document.getElementById('cpov');
  const pov=ovEl?(+ovEl.value||0):(+_ctemp.power_override||0);
  if(pov>0)power=Math.min(9999,pov);
  return {s,a:a2,p,hp:Math.round(100*(1+0.1*s)),mp:Math.round(100*(1+0.1*p)),power,band:bandName(power)}}

  const traits=structTraits(race.innate_passives).map(t=>t.name+(t.desc?'（'+t.desc+'）':'')).join('；')||'无';
  const negs=structTraits(race.innate_negatives).map(t=>t.name+(t.desc?'（'+t.desc+'）':'')).join('；')||'无';
  return '<b>'+esc(race.name)+'</b>｜补正：'+esc(chips)+'\n天赋：'+esc(traits)+'\n负面：'+esc(negs)+(race.race_lore?'\n'+esc(clampText(race.race_lore,80)):'')}

async function lcfg(){const el=document.getElementById('cf');el.innerHTML='<div class="loading">加载中...</div>';
  try{const c=await ag('config');
    const schema=(c&&c.schema&&typeof c.schema==='object')?c.schema:{};
    const runtime=(c&&c.runtime&&typeof c.runtime==='object')?c.runtime:(c||{});
    _cfgWorlds=(c&&Array.isArray(c.worlds))?c.worlds:_cfgWorlds;
    _cfgTypes={};
    let html='<div class="hintline">修改后点击「保存配置」即时生效（无需重启）。</div>';
    const keys=Object.keys(schema);
    const extra=Object.keys(runtime).filter(k=>keys.indexOf(k)<0&&k!=='schema'&&k!=='runtime'&&k!=='worlds');
    const allKeys=keys.concat(extra);
    if(!allKeys.length){el.innerHTML='<div class="loading">配置为空</div>';return}
    allKeys.forEach(k=>{
      const item=schema[k]||{};
      const type=String(item.type||'string').toLowerCase();
      const val=runtime[k];
      const hasVal=val!==undefined&&val!==null;
      _cfgTypes[k]=type;
      const desc=item.description||k;
      const hint=item.hint?'<div class="hintline" style="margin:4px 0 14px">'+esc(item.hint)+'</div>':'';
      let control;
      if(k==='default_world'||k==='default_world_name'){
        const cur=hasVal?String(val):'';
        const opts=['<option value="">(无)</option>'].concat(_cfgWorlds.map(w=>'<option value="'+esc(w)+'"'+(w===cur?' selected':'')+'>'+esc(w)+'</option>'));
        if(cur&&_cfgWorlds.indexOf(cur)<0)opts.push('<option value="'+esc(cur)+'" selected>'+esc(cur)+'（当前）</option>');
        control='<select id="cfg-'+esc(k)+'">'+opts.join('')+'</select>';
      }else if(type==='bool'){
        control='<label class="ckline"><input type="checkbox" id="cfg-'+esc(k)+'"'+(hasVal?(val?' checked':''):(item.default?' checked':''))+'> 启用</label>';
      }else if(type==='int'||type==='float'||type==='number'){
        control='<input id="cfg-'+esc(k)+'" type="number" '+(type==='float'?'step="any" ':'step="1" ')+'value="'+esc(hasVal?val:(item.default!==undefined?item.default:''))+'">';
      }else if(type==='object'||type==='list'||type==='dict'){
        control='<textarea id="cfg-'+esc(k)+'" rows="3" placeholder=\'JSON\'>'+esc(hasVal?JSON.stringify(val):JSON.stringify(item.default!==undefined?item.default:null))+'</textarea>';
      }else{
        control='<input id="cfg-'+esc(k)+'" type="text" value="'+esc(hasVal?val:(item.default!==undefined?item.default:''))+'">';
      }
      html+='<div class="cs"><div class="fg" style="margin-bottom:0"><label>'+esc(desc)+' <span style="opacity:.6">('+esc(k)+')</span></label>'+control+'</div>'+hint+'</div>';
    });
    html+='<button class="btn btn-p" onclick="scfg()">保存配置</button>';
    el.innerHTML=html}
  catch(e){el.innerHTML='<div class="loading" style="color:var(--danger)">'+esc(e.message)+'</div>'}}

async function scfg(){try{const p={};
  Object.keys(_cfgTypes).forEach(k=>{
    const el=document.getElementById('cfg-'+k);if(!el)return;
    const t=_cfgTypes[k];
    if(t==='bool')p[k]=el.checked;
    else if(t==='int'||t==='number'){const n=parseInt(el.value,10);p[k]=Number.isFinite(n)?n:0}
    else if(t==='float'){const n=parseFloat(el.value);p[k]=Number.isFinite(n)?n:0}
    else if(t==='object'||t==='list'||t==='dict'){try{p[k]=JSON.parse(el.value)}catch(e){p[k]=el.value}}
    else p[k]=el.value;
  });
  await ap('config/save',p);markLocal('config_changed');tt('配置已保存')}catch(e){tt(e.message,'bad')}}

/* config_changed 到达且配置页激活时：只就地更新控件值，不重建表单（保留焦点） */
async function updateConfigRuntime(){
  try{const c=await ag('config');
    const runtime=(c&&c.runtime&&typeof c.runtime==='object')?c.runtime:(c||{});
    _cfgWorlds=(c&&Array.isArray(c.worlds))?c.worlds:_cfgWorlds;
    Object.keys(_cfgTypes).forEach(k=>{
      const el=document.getElementById('cfg-'+k);if(!el)return;
      if(runtime[k]===undefined)return;
      if(document.activeElement===el)return; // 用户正在编辑的字段不打断
      if(_cfgTypes[k]==='bool')el.checked=!!runtime[k];else el.value=runtime[k];
    });
    tt('配置已同步')}
  catch(e){}
}
function refreshConfigWorldOptions(){
  const sel=document.getElementById('cfg-default_world')||document.getElementById('cfg-default_world_name');
  if(!sel)return;
  const cur=sel.value;
  const opts=['<option value="">(无)</option>'].concat(_cfgWorlds.map(w=>'<option value="'+esc(w)+'">'+esc(w)+'</option>'));
  if(cur&&_cfgWorlds.indexOf(cur)<0)opts.push('<option value="'+esc(cur)+'" selected>'+esc(cur)+'（当前）</option>');
  sel.innerHTML=opts.join('');sel.value=cur;
}

/* ══════════════════════════════════════════════
   渲染脚本
   ══════════════════════════════════════════════ */
function scriptCount(){document.getElementById('sc-count').textContent=_scriptsData.length+' / 50 条'}
async function lscripts(){const el=document.getElementById('scl');el.innerHTML='<div class="loading">加载中...</div>';
  try{const d=await ag('render-scripts');
    _scriptsData=Array.isArray(d)?d:(d&&Array.isArray(d.scripts)?d.scripts:[]);
    scriptCount();
    if(!_scriptsData.length){el.innerHTML='<div class="loading">暂无渲染脚本，点击右上角「+ 新增脚本」</div>';return}
    el.innerHTML=_scriptsData.map((s,i)=>{
      const on=s.enabled!==false;
      return '<div class="item"><div class="kv"><strong>#'+(i+1)+' '+esc(s.name||'未命名脚本')+'</strong> <span class="badge" style="'+(on?'background:rgba(62,143,176,0.2);color:var(--good)':'background:rgba(144,140,170,0.15);color:var(--dim)')+'">'+(on?'启用':'停用')+'</span><br><span class="script-regex" title="'+esc(s.find_regex)+'">'+esc(clampText(s.find_regex||'(空)',90))+'</span><br><span class="script-repl">→ '+esc(clampText(s.replace_string||'(删除匹配)',70))+'</span></div>'+
        '<label class="ckline" style="margin:0" title="切换启用状态"><input type="checkbox" '+(on?'checked':'')+' onchange="toggleScript(\''+jsq(s.id)+'\')"></label>'+
        '<button class="btn btn-sm" onclick="fillTest(\''+jsq(s.id)+'\')">试</button>'+
        '<button class="btn btn-sm" onclick="scriptEdit(\''+jsq(s.id)+'\')">编辑</button>'+
        '<button class="btn btn-sm btn-d" onclick="scriptDel(\''+jsq(s.id)+'\')">删</button></div>';
    }).join('')}
  catch(e){el.innerHTML='<div class="loading" style="color:var(--danger)">'+esc(e.message)+'</div>'}}

async function saveScripts(){
  if(_scriptsData.length>50){tt('脚本数量超过 50 条上限，请先删除','bad');return false}
  try{await ap('render-scripts/save',{scripts:_scriptsData});markLocal('render_scripts_changed');scriptCount();return true}
  catch(e){tt(e.message,'bad');return false}
}
async function toggleScript(id){const s=_scriptsData.find(x=>x.id===id);if(!s)return;s.enabled=!(s.enabled!==false);if(await saveScripts()){lscripts();tt(s.enabled?'已启用「'+s.name+'」':'已停用「'+s.name+'」')}else{lscripts()}}
function scriptNew(){_editScriptId=null;document.getElementById('se-title').textContent='新增脚本';document.getElementById('se-name').value='';document.getElementById('se-enabled').checked=true;document.getElementById('se-regex').value='';document.getElementById('se-repl').value='';document.getElementById('script-editor').style.display='block';document.getElementById('se-name').focus()}
function scriptEdit(id){const s=_scriptsData.find(x=>x.id===id);if(!s)return;_editScriptId=id;document.getElementById('se-title').textContent='编辑脚本';document.getElementById('se-name').value=s.name||'';document.getElementById('se-enabled').checked=s.enabled!==false;document.getElementById('se-regex').value=s.find_regex||'';document.getElementById('se-repl').value=s.replace_string||'';document.getElementById('script-editor').style.display='block';document.getElementById('se-regex').focus()}
function scriptEditorCancel(){document.getElementById('script-editor').style.display='none';_editScriptId=null}
async function scriptEditorSave(){
  const regex=document.getElementById('se-regex').value;
  if(!regex.trim()){tt('查找正则不能为空','bad');return}
  const item={id:_editScriptId||uid(),name:document.getElementById('se-name').value.trim()||('脚本 '+(_scriptsData.length+1)),enabled:document.getElementById('se-enabled').checked,find_regex:regex,replace_string:document.getElementById('se-repl').value};
  if(_editScriptId){const i=_scriptsData.findIndex(x=>x.id===_editScriptId);if(i>=0)_scriptsData[i]=item;else _scriptsData.push(item)}
  else{if(_scriptsData.length>=50){tt('已达 50 条上限','bad');return}_scriptsData.push(item)}
  if(await saveScripts()){scriptEditorCancel();lscripts();tt('脚本已保存，保存即生效')}
}
async function scriptDel(id){const s=_scriptsData.find(x=>x.id===id);if(!s)return;
  if(!(await uiConfirm('删除脚本「'+(s.name||id)+'」？','删除脚本')))return;
  _scriptsData=_scriptsData.filter(x=>x.id!==id);
  if(await saveScripts()){lscripts();tt('脚本已删除')}}
function fillTest(id){const s=_scriptsData.find(x=>x.id===id);if(!s)return;document.getElementById('ts-regex').value=s.find_regex||'';document.getElementById('ts-repl').value=s.replace_string||'';document.getElementById('ts-out').hidden=true;document.querySelector('#p-scripts .cs').scrollIntoView({behavior:'smooth'});tt('已填入测试区，输入示例文本后点「▶ 测试」')}
async function runScriptTest(){
  const regex=gv('ts-regex'),repl=gv('ts-repl'),sample=gv('ts-sample');
  if(!regex.trim()){tt('请输入查找正则','bad');return}
  const out=document.getElementById('ts-out');
  out.hidden=false;out.textContent='测试中...';
  try{const r=await ap('render-scripts/test',{find_regex:regex,replace_string:repl,sample:sample});
    const res=(r&&r.result!==undefined)?r.result:(r&&r.data&&r.data.result!==undefined?r.data.result:JSON.stringify(r,null,2));
    out.textContent=typeof res==='string'?res:JSON.stringify(res,null,2)}
  catch(e){out.textContent='测试失败：'+e.message;out.hidden=false}
}

/* ══════════════════════════════════════════════
   页签切换与启动
   ══════════════════════════════════════════════ */
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('act'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('act'));
  t.classList.add('act');document.getElementById('p-'+t.dataset.t).classList.add('act');
  _activeTab=t.dataset.t;
}});

async function boot(){
  if(!window.AstrBotPluginPage){
    showBanner('未检测到插件页面桥接环境。请在 AstrBot 面板 → 插件 → 如我所书 的「页面」中打开本管理页（直接以文件方式打开时无法访问插件数据）。');
    document.getElementById('wl').innerHTML='<div class="loading">等待桥接环境…</div>';
    return;
  }
  P=window.AstrBotPluginPage;
  try{await withTimeout(P.ready(),8000)}
  catch(e){
    showBanner('页面桥接初始化失败：'+e.message+'。请从 AstrBot 面板的插件页面中重新打开。');
    return;
  }
  /* 主题：暗色默认；onContext 订阅 isDark 切换（桥自身也会设置 html[data-theme]） */
  try{P.onContext(ctx=>{_ctx=ctx||{};const dark=_ctx.isDark!==false;document.body.setAttribute('data-theme',dark?'dark':'light')})}catch(e){}
  setSync(false,'正在建立实时同步…');
  sseConnect();
  ag('health').catch(()=>tt('后端接口暂未就绪，稍后会自动恢复','bad'));
  lw();lc();ls();lcfg();lscripts();
  /* 图鉴缓存供角色编辑器下拉使用 */
  ag('archetypes',{type:'race'}).then(d=>{_archCache.race=entriesOf(d&&d.archetypes?d.archetypes:d)}).catch(()=>{});
  ag('archetypes',{type:'job'}).then(d=>{_archCache.job=entriesOf(d&&d.archetypes?d.archetypes:d)}).catch(()=>{});
}
boot();
</script>
